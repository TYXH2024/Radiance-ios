name: chapter2-pathtrace

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'chapter2/pathtrace/**'
      - '.github/workflows/chapter2-pathtrace.yml'

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # 第二章 2.2 阶段交付：pathtrace mod JAR。
  #   1. 交叉编译 libradiance_pathtrace.dylib (iphoneos arm64, JNI 场景
  #      管理 + 离屏 pathtrace 派发)
  #   2. 编译 pathtrace.metallib (MSL metal3: scene_trace_kernel 2.1 原样
  #      + pathtrace_kernel 全链路径追踪)
  #   3. ad-hoc 签名（ldid / codesign 兜底）
  #   4. Java 编译 + JAR 组装（资产内嵌）
  #   5. 运行页上传成品 artifact（jar + dylib + metallib）—— 绿勾即可就地下载
  #      （v0.1 首发遗漏此步致运行页无成品，v0.1.1 补齐对齐 2.0/2.1 模式）
  #   6. 发预发布 Release（幂等：已存在则 --clobber 重传资产）
  # 本地无 macOS 无法构建原生部分 —— 全链在此产线完成。
  # ------------------------------------------------------------------
  build-and-release:
    name: build mod jar + release (macos-26)
    runs-on: macos-26
    steps:
      - name: Checkout Radiance-ios
        uses: actions/checkout@v4

      - name: Set up JDK 21 (javac + jni.h)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build mod jar (natives + metallib + java)
        run: |
          set -ex
          chmod +x chapter2/pathtrace/build.sh
          bash chapter2/pathtrace/build.sh
          JAR="chapter2/pathtrace/pathtrace-0.2.0.jar"
          test -f "$JAR"
          cp "$JAR" ./pathtrace-0.2.0.jar

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pathtrace-jar
          path: |
            pathtrace-0.2.0.jar
            chapter2/pathtrace/build/native/libradiance_pathtrace.dylib
            chapter2/pathtrace/build/native/pathtrace.metallib
          if-no-files-found: error

      - name: Verify native surface
        run: |
          set -ex
          DYLIB="chapter2/pathtrace/build/native/libradiance_pathtrace.dylib"
          file "$DYLIB"
          nm -gU "$DYLIB" | grep -q "Java_net_prisma_pathtrace_Native_initNative" \
            && echo "JNI_EXPORT_OK(initNative)"
          nm -gU "$DYLIB" | grep -q "Java_net_prisma_pathtrace_Native_rebuildSingleNative" \
            && echo "JNI_EXPORT_OK(rebuildSingleNative)"
          nm -gU "$DYLIB" | grep -q "Java_net_prisma_pathtrace_Native_castRayNative" \
            && echo "JNI_EXPORT_OK(castRayNative)"
          nm -gU "$DYLIB" | grep -q "Java_net_prisma_pathtrace_Native_sentinelProbeNative" \
            && echo "JNI_EXPORT_OK(sentinelProbeNative)"
          nm -gU "$DYLIB" | grep -q "Java_net_prisma_pathtrace_Native_sceneStatsNative" \
            && echo "JNI_EXPORT_OK(sceneStatsNative)"
          nm -gU "$DYLIB" | grep -q "Java_net_prisma_pathtrace_Native_instanceOriginNative" \
            && echo "JNI_EXPORT_OK(instanceOriginNative)"
          nm -gU "$DYLIB" | grep -q "Java_net_prisma_pathtrace_Native_sceneAuditNative" \
            && echo "JNI_EXPORT_OK(sceneAuditNative)"
          nm -gU "$DYLIB" | grep -q "Java_net_prisma_pathtrace_Native_renderIsolatedNative" \
            && echo "JNI_EXPORT_OK(renderIsolatedNative)"
          nm -gU "$DYLIB" | grep -q "Java_net_prisma_pathtrace_Native_renderPathtraceNative" \
            && echo "JNI_EXPORT_OK(renderPathtraceNative)"
          nm -gU "$DYLIB" | grep -q "Java_net_prisma_pathtrace_Native_shutdownNative" \
            && echo "JNI_EXPORT_OK(shutdownNative)"
          # 2.1 已删的 v0.4 诊断矩阵入口不得在 2.2 dylib 中出现
          if nm -gU "$DYLIB" | grep -Eq "sceneInfoNative|setPlacementModeNative"; then
            echo "FATAL: stale 2.1 diagnostic entry points present"; exit 1
          fi
          echo "JNI_SURFACE_CLEAN(2.2)"
          # metallib 双 kernel 验证
          METALLIB="chapter2/pathtrace/build/native/pathtrace.metallib"
          file "$METALLIB"
          test -s "$METALLIB"

      - name: Release (pathtrace-v0.2, prerelease)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -ex
          TAG="pathtrace-v0.2"
          TITLE="pathtrace v0.2 — PLACEMENT_FAIL 判别仪器（raw AABB 审计/顶点回读/矩阵回读/隔离 TLAS 对照+隔离渲染通道）+ 摄取覆盖修复（空试重试）"
          NOTES_FILE=release-notes.md
          cat > "$NOTES_FILE" <<'EOF'
          # pathtrace v0.2 — PLACEMENT_FAIL 根因判别版（仪器修复，非盲改）

          **v0.1 真机回收判读**：判 PLACEMENT_FAIL（六向全 miss、S7 被闸）。
          哨兵 3/3 PASS、相机区块 (16,80,0) 已摄取（verts=2344 与 2.1 v0.5
          完全一致）——但全部 ray miss。离线比对结论：**2.2 fork 的提取/
          BLAS/TLAS/矩阵/kernel 与 2.1 v0.5 真机验证实现数学等价**（逐函数
          diff），静态分析无法再编缩差距——所以本版不盲改摆放代码，
          而是把判别仪器装上（用户零粉饰纪律）。

          **v0.2 内容**：
          - **S6.5 判别审计**（新 native 入口 sceneAuditNative）：
            ① raw-AABB 审计（2.1 v0.5 仪器回归——v0.1 fork 丢了它，
            导致六向全 miss 却无顶点空间证据）②相机区块 BLAS 顶点回读
            （真实字节眼见为实）③live TLAS 实例矩阵回读（flat[9..11] vs
            expect origin）④**隔离单实例 TLAS 对照电池**——同一 BLAS、
            同一 trace_ray，与 live TLAS 并排打同一组 ray：
            ISO 命中+LIVE miss ⇒ live TLAS 组装缺陷；ISO 也 miss ⇒
            BLAS 内容缺陷。一次真机运行必出定谳证据。
          - **隔离渲染诊断通道**（renderIsolatedNative）：live 摆放未过时，
            用相机区块单实例 TLAS + 同一渲染管线/同一 shading 池渲染同一帧
            ——若成图即渲染链全链健康（且这就是第一帧光：相机区块的真实
            路径追踪画面）；新判定 ISO_RENDER_OK（语义：渲染链健康、
            缺陷隔离到 multi-instance TLAS 组装）。
          - **摄取覆盖修复**：v0.1 真机实测 36/157 覆盖塔缩（只扫到 y≥48
            层；低 y 层首轮被试成空→invalidate→永不再试——世界加载时序
            敏感缺陷，2.1 运气好）。空试槽位窗口内每 2s 可重试（上限 6 次）。
          - 判定新增 ISO_RENDER_OK；PLACEMENT_FAIL 消息指向 [audit] 行。

          **使用**：替换 mods/ 内旧 JAR → 进世界停留 30–40s（覆盖修复后
          摄取更全，窗口或稍长）→ 回报 pathtrace_report.txt +
          pathtrace_frame.png（若隔离通道成图）。
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" ./pathtrace-0.2.0.jar --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" ./pathtrace-0.2.0.jar \
                 --title "$TITLE" --notes-file "$NOTES_FILE" \
                 --prerelease --repo "$GITHUB_REPOSITORY"
          fi
          echo "RELEASE_DONE $TAG"
