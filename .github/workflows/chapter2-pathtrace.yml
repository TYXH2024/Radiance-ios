name: chapter2-pathtrace

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'chapter2/pathtrace/**'
      - '.github/workflows/chapter2-pathtrace.yml'

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # 第二章 2.3 阶段交付：pathtrace mod JAR（实时累积 + GL 合成 + atlas）。
  #   1. 交叉编译 libradiance_pathtrace.dylib (iphoneos arm64, JNI 场景
  #      管理 + 离屏 pathtrace + live 会话族)
  #   2. 编译 pathtrace.metallib (MSL metal3: scene_trace_kernel 2.1 原样
  #      + pathtrace_kernel 累积模式 + present_kernel 2.3 新增)
  #   3. ad-hoc 签名（ldid / codesign 兜底）
  #   4. Java 编译 + JAR 组装（资产 + mixin 类 + pathtrace.mixins.json）
  #   5. 运行页上传成品 artifact（jar + dylib + metallib）—— 绿勾即可就地下载
  #   6. 发预发布 Release（幂等：已存在则 --clobber 重传资产）
  # 本地无 macOS 无法构建原生部分 —— 全链在此产线完成。
  # ------------------------------------------------------------------
  build-and-release:
    name: build mod jar + release (macos-26)
    runs-on: macos-26
    steps:
      - name: Checkout Radiance-ios
        uses: actions/checkout@v4

      - name: Set up JDK 21 (javac + jni.h)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build mod jar (natives + metallib + java + mixin)
        run: |
          set -ex
          chmod +x chapter2/pathtrace/build.sh
          bash chapter2/pathtrace/build.sh
          JAR="chapter2/pathtrace/pathtrace-0.5.0.jar"
          test -f "$JAR"
          cp "$JAR" ./pathtrace-0.5.0.jar

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pathtrace-jar
          path: |
            pathtrace-0.5.0.jar
            chapter2/pathtrace/build/native/libradiance_pathtrace.dylib
            chapter2/pathtrace/build/native/pathtrace.metallib
          if-no-files-found: error

      - name: Verify native surface
        run: |
          set -ex
          DYLIB="chapter2/pathtrace/build/native/libradiance_pathtrace.dylib"
          file "$DYLIB"
          nm -gU "$DYLIB" | grep -q "Java_net_prisma_pathtrace_Native_initNative" \
            && echo "JNI_EXPORT_OK(initNative)"
          nm -gU "$DYLIB" | grep -q "Java_net_prisma_pathtrace_Native_rebuildSingleNative" \
            && echo "JNI_EXPORT_OK(rebuildSingleNative)"
          nm -gU "$DYLIB" | grep -q "Java_net_prisma_pathtrace_Native_castRayNative" \
            && echo "JNI_EXPORT_OK(castRayNative)"
          # v0.4.4: 双句柄 A/B + 身份快照（TLAS 毒化追凶仪器）
          nm -gU "$DYLIB" | grep -q "Java_net_prisma_pathtrace_Native_castRayVerifiedNative" \
            && echo "JNI_EXPORT_OK(castRayVerifiedNative)"
          nm -gU "$DYLIB" | grep -q "Java_net_prisma_pathtrace_Native_tlasIdentityNative" \
            && echo "JNI_EXPORT_OK(tlasIdentityNative)"
          # v0.4.5: 实例普查 + 共享内存审计（TLAS 毒化定谳仪器）
          nm -gU "$DYLIB" | grep -q "Java_net_prisma_pathtrace_Native_instanceCensusNative" \
            && echo "JNI_EXPORT_OK(instanceCensusNative)"
          nm -gU "$DYLIB" | grep -q "Java_net_prisma_pathtrace_Native_sharedAuditNative" \
            && echo "JNI_EXPORT_OK(sharedAuditNative)"
          nm -gU "$DYLIB" | grep -q "Java_net_prisma_pathtrace_Native_sentinelProbeNative" \
            && echo "JNI_EXPORT_OK(sentinelProbeNative)"
          nm -gU "$DYLIB" | grep -q "Java_net_prisma_pathtrace_Native_sceneStatsNative" \
            && echo "JNI_EXPORT_OK(sceneStatsNative)"
          nm -gU "$DYLIB" | grep -q "Java_net_prisma_pathtrace_Native_instanceOriginNative" \
            && echo "JNI_EXPORT_OK(instanceOriginNative)"
          nm -gU "$DYLIB" | grep -q "Java_net_prisma_pathtrace_Native_sceneAuditNative" \
            && echo "JNI_EXPORT_OK(sceneAuditNative)"
          nm -gU "$DYLIB" | grep -q "Java_net_prisma_pathtrace_Native_renderIsolatedNative" \
            && echo "JNI_EXPORT_OK(renderIsolatedNative)"
          nm -gU "$DYLIB" | grep -q "Java_net_prisma_pathtrace_Native_renderPathtraceNative" \
            && echo "JNI_EXPORT_OK(renderPathtraceNative)"
          nm -gU "$DYLIB" | grep -q "Java_net_prisma_pathtrace_Native_refreshTlasNative" \
            && echo "JNI_EXPORT_OK(refreshTlasNative)"
          # v0.4.8: ping-pong 替换件 + 孪生零接触定谳（毒化写手工程解）
          nm -gU "$DYLIB" | grep -q "Java_net_prisma_pathtrace_Native_pingpongNative" \
            && echo "JNI_EXPORT_OK(pingpongNative)"
          nm -gU "$DYLIB" | grep -q "Java_net_prisma_pathtrace_Native_twinArmNative" \
            && echo "JNI_EXPORT_OK(twinArmNative)"
          nm -gU "$DYLIB" | grep -q "Java_net_prisma_pathtrace_Native_twinProbeNative" \
            && echo "JNI_EXPORT_OK(twinProbeNative)"
          nm -gU "$DYLIB" | grep -q "Java_net_prisma_pathtrace_Native_setAtlasEnabledNative" \
            && echo "JNI_EXPORT_OK(setAtlasEnabledNative)"
          # 2.3 live 会话族（11 个新入口）
          for SYM in liveBeginNative liveFrameNative liveResetNative \
                     livePresentNative liveReadbackNative liveStatsNative \
                     liveDimsNative liveAtlasBufferNative uploadAtlasNative \
                     liveRefreshNative liveEndNative; do
            nm -gU "$DYLIB" | grep -q "Java_net_prisma_pathtrace_Native_${SYM}" \
              && echo "JNI_EXPORT_OK(${SYM})"
          done
          nm -gU "$DYLIB" | grep -q "Java_net_prisma_pathtrace_Native_shutdownNative" \
            && echo "JNI_EXPORT_OK(shutdownNative)"
          # 2.1 已删的 v0.4 诊断矩阵入口不得在 dylib 中出现
          if nm -gU "$DYLIB" | grep -Eq "sceneInfoNative|setPlacementModeNative"; then
            echo "FATAL: stale 2.1 diagnostic entry points present"; exit 1
          fi
          echo "JNI_SURFACE_CLEAN(2.3)"
          # metallib 三 kernel 验证（2.3: present_kernel 新增）
          METALLIB="chapter2/pathtrace/build/native/pathtrace.metallib"
          file "$METALLIB"
          test -s "$METALLIB"
          # JAR 内容验证：mixin 类 + mixins.json 必须在包内
          JAR="chapter2/pathtrace/pathtrace-0.5.0.jar"
          unzip -l "$JAR" | grep -q "net/prisma/pathtrace/mixin/PathtraceWindowMixin.class" \
            && echo "JAR_MIXIN_CLASS_OK"
          unzip -l "$JAR" | grep -q "pathtrace.mixins.json" \
            && echo "JAR_MIXIN_JSON_OK"
          unzip -l "$JAR" | grep -q "fabric.mod.json" \
            && echo "JAR_FABRIC_MOD_OK"

      - name: Release (pathtrace-v0.5.0, prerelease)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -ex
          TAG="pathtrace-v0.5.0"
          TITLE="pathtrace v0.5.0 CANOPY — 树叶/玻璃/草丛 alpha 镂空（cutoutTrace + 阴影射线镂空：树冠见孔、树影斑驳）+ ping-pong 自 t=0（孪生默认关——开场闪屏消亡）——噪点按指示不动（性能优先）"
          NOTES_FILE=release-notes.md
          cat > "$NOTES_FILE" <<'EOF'
          # pathtrace v0.5.0 — CANOPY（树叶镂空 + 开场无闪屏）
          
          **背景**：v0.4.9 CLARITY 真机回收（A20 Pro 完整 90s 窗）：画质四刀全部生效——用户判词「画质可以了（原来的感觉像抗锯齿）」，阴影 ✓，LIVE_OK 收口；ping-pong 时代零死亡、spp 6404（104s 仍在收敛）、稳态吞吐 ~107-110 Mray/s、resets 30s 后冻结。三问剩两：①树叶不透明——截屏树冠「绿黑像素交错」= alpha 镂空缺失（透明纹素被当不透明面着色，atlas 透明纹素处 RGB 为黑）②开场闪屏——旧协议 0-30s 基线期 5 次死亡、每次 5-10s 全 miss 帧（天空色铺满，即用户描述的「灰色遮罩/全世界材质丢失呈天空色」）。
          
          **两刀**：
          1. **alpha cutout（pathtrace.metal，唯一内核改动）**：新增
             cutoutTrace()——命中后采样 atlas alpha，低于 0.5（MC cutout
             阈值）的纹素视为孔洞，射线推进 tMin 重查（≤8 轮）；阴影射线
             同样处理（≤6 轮，耗尽保守遮挡）。效果：树叶见孔、玻璃透亮、
             草丛成簇，树影变斑驳光影而非实心黑板。UV 哨兵层与无 atlas
             白纹理回退天然不透明（零行为变化）。每轮重查如实计入
             rayStats——Mray/s 仍是诚实计量值。scene_trace_kernel
             （2.1 仪器）逐字不动：哨兵/census 行字节级可比。
          2. **ping-pong 自 t=0（协议默认翻转，纯 Java）**：孪生默认关
             （M3 0/6 外部写手 / A20 Pro 两型定谳均已归档——科学环节功成
             身退）→ ping-pong 于 LiveSession 首个 tick（t≈0）激活：
             替换件年龄恒 <0.5s，基线期死亡循环（=开场闪屏）自本版起
             不存在。-Dpathtrace.twin=true 恢复 v0.4.8/0.4.9 的 90s
             取证协议（t=10s 装填 → t=30s 定谳）。
          
          **噪点按用户指示不动**（性能优先）：cutout 会小幅增加树冠
          视角的查询数（每帧 ~1.3-2×，全部计入计量）——若帧率不可接受
          回报 [live] 行的 f/s 与场景描述。
          
          **使用协议（简化：进世界即稳定）**：替换 mods/ 内旧 JAR，
          同一存档静止同一姿态。回报 pathtrace_report.txt + 三 PNG，
          v0.5.0 新增重点行：
          - **[pingpong] 激活 @0s**——开场闪屏消亡的直接证据
          - **[pingpong 收口]** 行——窗内 canary 死亡应为 0
            （旧称 [v0.4.8 收口]）
          - **SNAP1 改 8s**（旧死亡窗内的稳定画面证据）
          - 树冠/玻璃屏摄：树叶应见孔洞、树影应斑驳、玻璃应透
          
          开关：-Dpathtrace.twin=true（复现 90s 取证协议）/
          -Dpathtrace.pingpong=false（对照）/
          -Dpathtrace.rtW=480（回退旧分辨率档）
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" ./pathtrace-0.5.0.jar --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" ./pathtrace-0.5.0.jar \
                 --title "$TITLE" --notes-file "$NOTES_FILE" \
                 --prerelease --repo "$GITHUB_REPOSITORY"
          fi
          echo "RELEASE_DONE $TAG"
